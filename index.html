<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>GKME 网页手柄</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="gamepad"></canvas>

  <!-- Floating status pill -->
  <div id="topbar">
    <span id="statusDot"></span>
    <span id="statusText">未连接</span>
  </div>

  <!-- Shown until the WebSocket handshake completes -->
  <div id="connectOverlay">
    <div class="card">
      <div class="logo">GKME</div>
      <div class="subtitle">网页虚拟手柄</div>
      <div id="connectMsg" class="msg">正在连接电脑端…</div>
      <button id="connectBtn" class="primary">连接 / 进入全屏</button>
      <div class="tips">
        <p>· 电脑端需已运行 GKME，并显示“网页手柄”地址</p>
        <p>· 横屏使用获得完整布局</p>
        <p>· 体感/振动需 HTTPS（首次访问需信任自签名证书）</p>
      </div>
    </div>
  </div>

  <!-- Settings overlay -->
  <div id="settings" class="hidden">
    <aside id="settingsNav">
      <button id="settingsClose" class="sideback">
        <svg class="sideback-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="#CCCCCC" d="M20,11H7.8l5.6,-5.6L12,4l-8,8 8,8 1.4,-1.4L7.8,13H20v-2z" />
        </svg>
        <span>返回</span>
      </button>
      <div class="sidebar-divider"></div>
      <div id="settingsNavList"></div>
    </aside>
    <main id="settingsMain">
      <header class="settingsheader">
        <span class="settingsTitle">GKME 设置</span>
      </header>
      <div id="settingsBody"></div>
    </main>
  </div>

  <!-- Layout editor toolbar -->
  <div id="editbar"></div>

  <div id="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
